<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | ShopDash</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="icon" href="../../assets/deexhosa.jpg">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="app-container">
  <aside class="sidebar" id="sidebar">
    <div class="logo"><i class="fas fa-bolt"></i> ShopDash</div>
    <ul class="nav-links">
      <li><a href="index.html"><i class="fas fa-chart-line"></i> Dashboard</a></li>
      <li><a href="products.html"><i class="fas fa-box"></i> Products</a></li>
      <li><a href="orders.html"><i class="fas fa-truck"></i> Orders</a></li>
      <li><a href="customers.html"><i class="fas fa-users"></i> Customers</a></li>
    </ul>
  </aside>
  <main class="main-content">
    <div class="top-bar">
      <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i> Menu</button>
      <h1 class="page-title">Dashboard</h1>
      <div class="date-badge" id="dateBadge"></div>
    </div>

    <div class="metrics-grid" id="metricsGrid"></div>

    <div class="chart-container">
      <canvas id="salesChart" width="400" height="200"></canvas>
    </div>

    <div style="margin-top: 2rem;">
      <h3>📦 Recent Orders</h3>
      <div class="table-container">
        <table id="recentOrdersTable">
          <thead><tr><th>Order ID</th><th>Customer</th><th>Total</th><th>Status</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </main>
</div>
<script src="js/common.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
