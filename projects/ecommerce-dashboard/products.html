<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products | ShopDash</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
<div class="app-container">
  <aside class="sidebar" id="sidebar">...</aside> <!-- same sidebar -->
  <main class="main-content">
    <div class="top-bar">
      <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i> Menu</button>
      <h1 class="page-title">Products</h1>
      <button class="btn btn-primary" id="addProductBtn"><i class="fas fa-plus"></i> Add Product</button>
    </div>
    <div class="table-container">
      <table id="productsTable">
        <thead><tr><th>Image</th><th>Name</th><th>Price</th><th>Stock</th><th>Category</th><th>Actions</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </main>
</div>
<div id="productModal" class="modal">...</div> <!-- same modal -->
<script src="js/common.js"></script>
<script src="js/products.js"></script>
</body>
</html>
